name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: proxysss-windows-amd64.zip
            binary: proxysss.exe
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: proxysss-linux-amd64.tar.gz
            binary: proxysss
            rustflags: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: proxysss-linux-arm64.tar.gz
            binary: proxysss
            rustflags: ''
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: proxysss-darwin-arm64.tar.gz
            binary: proxysss
            rustflags: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-target-${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          if [[ "$TARGET" == aarch64-* ]]; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package complete release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Asset '${{ matrix.asset }}'

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          ./scripts/package-msi.ps1 -Target '${{ matrix.target }}' -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: msi-${{ matrix.target }}
          path: dist/*.msi
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          compression-level: 0
          path: dist/${{ matrix.asset }}

name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: proxysss-windows-amd64.zip
            binary: proxysss.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: proxysss-windows-arm64.zip
            binary: proxysss.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: proxysss-linux-amd64.tar.gz
            binary: proxysss
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: proxysss-linux-arm64.tar.gz
            binary: proxysss
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: proxysss-darwin-amd64.tar.gz
            binary: proxysss
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: proxysss-darwin-arm64.tar.gz
            binary: proxysss

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          shared-key: rust-target-${{ matrix.target }}

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build Linux on Debian 12
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -e CARGO_HOME=/work/.cargo-ci -v "$GITHUB_WORKSPACE:/work" -w /work
          rust:1.96.0-bookworm cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package complete release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Asset '${{ matrix.asset }}'

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          compression-level: 0
          path: dist/${{ matrix.asset }}

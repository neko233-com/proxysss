name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-release-metadata:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify release version and changelog
        shell: bash
        run: |
          set -euo pipefail
          # Functional validation is performed before tagging. Dispatch builds
          # rehearse packaging; tags also require matching release metadata.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "not a tag build; release metadata check is a rehearsal"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$cargo_version" = "${tag#v}"
          grep -Eq "^## ${tag}( |$)" CHANGELOG.md
          echo "Version and changelog match; no benchmark is required for release."

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: proxysss-windows-amd64.zip
            binary: proxysss.exe
            use_xwin: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: proxysss-windows-arm64.zip
            binary: proxysss.exe
            use_xwin: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: proxysss-linux-amd64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: proxysss-linux-arm64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: proxysss-darwin-amd64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: proxysss-darwin-arm64.tar.gz
            binary: proxysss
            use_xwin: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          shared-key: rust-target-${{ matrix.target }}

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build Linux on Debian 12
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -e CARGO_HOME=/work/.cargo-ci -v "$GITHUB_WORKSPACE:/work" -w /work
          rust:1.96.0-bookworm cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package complete release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Asset '${{ matrix.asset }}'

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          ./scripts/package-msi.ps1 -Target '${{ matrix.target }}' -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: msi-${{ matrix.target }}
          path: dist/*.msi
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          compression-level: 0
          path: dist/${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-release-metadata]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Extract current changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! grep -Eq "^## ${tag}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section heading for ${tag}" >&2
            echo "Add: ## ${tag} - YYYY-MM-DD" >&2
            exit 1
          fi
          awk -v tag="$tag" '
            $0 ~ "^## " tag "( |$)" { found=1 }
            found && $0 ~ "^## " && $0 !~ "^## " tag "( |$)" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/**/*

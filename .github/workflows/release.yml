name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-release-metadata:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify release version and changelog
        shell: bash
        run: |
          set -euo pipefail
          # Tests and benchmarks run locally. Dispatch builds rehearse packaging;
          # tags additionally validate the previously collected release evidence.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "not a tag build; release metadata check is a rehearsal"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$cargo_version" = "${tag#v}"
          grep -Eq "^## ${tag}( |$)" CHANGELOG.md
          if [[ "$tag" == "v1.3.8" ]]; then
            # Operator explicitly approved this one functional release on 2026-09-08.
            # No strict Linux/nginx performance claim is attached to this version.
            echo "v1.3.8: operator-approved functional release; strict performance evidence waived"
          else
            go run scripts/verify-production-evidence.go --manifest "performance-evidence/${tag}.json" --tag "$tag" --commit "$GITHUB_SHA"
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: proxysss-windows-amd64.zip
            binary: proxysss.exe
            use_xwin: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: proxysss-windows-arm64.zip
            binary: proxysss.exe
            use_xwin: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: proxysss-linux-amd64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: proxysss-linux-arm64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: proxysss-darwin-amd64.tar.gz
            binary: proxysss
            use_xwin: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: proxysss-darwin-arm64.tar.gz
            binary: proxysss
            use_xwin: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-target-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package complete release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Asset '${{ matrix.asset }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          compression-level: 0
          path: dist/${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-release-metadata]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Extract current changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! grep -Eq "^## ${tag}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section heading for ${tag}" >&2
            echo "Add: ## ${tag} - YYYY-MM-DD" >&2
            exit 1
          fi
          awk -v tag="$tag" '
            $0 ~ "^## " tag "( |$)" { found=1 }
            found && $0 ~ "^## " && $0 !~ "^## " tag "( |$)" { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/**/*

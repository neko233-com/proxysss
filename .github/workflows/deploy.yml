name: deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Deployment profile name
        required: true
        default: production

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: proxysss.exe
            rustflags: -C target-feature=+crt-static
            artifact: deploy-windows-amd64
            archive: deploy-windows-amd64.zip
            use_xwin: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: proxysss
            rustflags: ''
            artifact: deploy-linux-amd64
            archive: deploy-linux-amd64.tar.gz
            use_xwin: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: proxysss
            rustflags: ''
            artifact: deploy-linux-arm64
            archive: deploy-linux-arm64.tar.gz
            use_xwin: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: proxysss
            rustflags: ''
            artifact: deploy-darwin-arm64
            archive: deploy-darwin-arm64.tar.gz
            use_xwin: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-target-${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          if [[ "$TARGET" == aarch64-* ]]; then
            sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package complete release bundle
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -Asset '${{ matrix.archive }}'

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          ./scripts/package-msi.ps1 -Target '${{ matrix.target }}' -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: msi-${{ matrix.target }}
          path: dist/*.msi
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          compression-level: 0
          path: dist/${{ matrix.archive }}

  deploy-summary:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Emit deployment summary
        run: |
          echo "Deploy profile: ${{ github.event.inputs.profile || 'production' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build artifacts are ready in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

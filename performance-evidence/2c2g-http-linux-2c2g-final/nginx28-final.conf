worker_processes 2;
worker_rlimit_nofile 8192;
error_log /tmp/bench2c2g/logs/nginx-error.log error;
pid /tmp/bench2c2g/logs/nginx.pid;
events { worker_connections 4096; use epoll; multi_accept on; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    server_tokens off;
    open_file_cache max=1024 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    upstream bench_backend { server 127.0.0.1:19081; keepalive 128; }
    server {
        listen 127.0.0.1:19080 reuseport;
        location /rp/ {
            proxy_pass http://bench_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
        location / { root /tmp/bench2c2g/www; index index.html; }
    }
}

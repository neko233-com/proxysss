worker_processes 1;
error_log /tmp/bench2c2g/logs/backend-error.log error;
pid /tmp/bench2c2g/logs/backend.pid;
events { worker_connections 4096; use epoll; multi_accept on; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    server { listen 127.0.0.1:19081; root /tmp/bench2c2g/www; }
}
